
<!-- Lab additions (Wazuh merges multiple ossec_config blocks). -->
<ossec_config>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <syscheck>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/passwd,/etc/shadow,/etc/sudoers.d,/etc/cron.d,/etc/ssh,/root,/tmp</directories>
  </syscheck>
</ossec_config>
