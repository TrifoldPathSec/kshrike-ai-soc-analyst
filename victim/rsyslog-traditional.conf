# Write log files in the traditional "Mon DD HH:MM:SS host prog[pid]: msg"
# syslog format. Ubuntu's rsyslog defaults to a high-precision ISO8601
# timestamp, which Wazuh's syslog/sshd decoders cannot parse — so without this,
# auth events reach auth.log but Wazuh never decodes them into alerts.
$ActionFileDefaultTemplate RSYSLOG_TraditionalFileFormat
